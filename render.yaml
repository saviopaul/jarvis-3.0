services:
  - type: web
    name: jarvis-3-telegram-bot
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: jarvis-3-telegram-bot
          property: host

  - type: redis
    name: jarvis-memory
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
