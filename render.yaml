services:
  - type: web
    name: jarvis-3-telegram-bot
    env: docker
    region: oregon
    plan: starter            # free tier sleeps after 15 min idle and drops Telegram webhooks
    healthCheckPath: /health # Render restarts the instance if this stops answering
    envVars:
      - key: BOT_WORKER_THREADS
        value: "8"
      - key: KEEP_ALIVE_SECONDS
        value: "600"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: jarvis-3-telegram-bot
          property: host

  - type: redis
    name: jarvis-memory
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
